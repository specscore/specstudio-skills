name: Lint

# Gates the spec tree with the released specscore CLI so idea-sync (and other)
# drift can't silently accumulate — this repo has no Go source of its own, so
# it installs the published CLI rather than building from source.

on:
  # push runs only on main (post-merge gate); PR branches are covered by the
  # pull_request event below, so a branch with an open PR runs the gate once.
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - 'spec/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install specscore CLI
        run: curl -fsSL https://specscore.md/install/get-cli | sh
      - name: Show specscore version
        run: specscore --version
      - name: Lint spec tree
        run: specscore spec lint

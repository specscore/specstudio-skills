# SpecScore Repo Config Schema: https://specscore.md/repo-config

project:
    title: specstudio-skills
    host: github.com
    org: specscore
    repo: specstudio-skills

gates:
  feature.approved:
    reviewers:
      - name: spec-document-reviewer
        type: ai
        prompt: skills/specify/references/reviewer-prompt.md
        description: Baseline SpecScore Feature reviewer — enforces six blocker categories
      - name: user-approval
        type: human
  implementation.pre_commit:
    reviewers:
      - name: auto-approve
        type: auto-approve
        description: Autonomous commit checkpoint for specstudio:implement — no human review at pre-commit

# ship: deploy delegation for specstudio:ship (optional).
# When `delegate` is set, ship dispatches it once after its gates pass; when
# absent (as here), ship runs the gates and hands back without deploying.
# The block recognizes ONLY delegate.skill + delegate.args — no sequencing/
# retry/rollback/canary/flag-flip/scheduling fields (see the ship Feature's
# bars-execution-and-orchestration AC).
# ship:
#   delegate:
#     skill: gh-deploy
#     args: "production"

# pull_request: PR-creation delegation for specstudio:pull-request (optional).
# When `delegate` is set, the skill dispatches it once after its gate releases;
# when absent, the skill creates the PR itself (git push + gh pr create, a
# ready PR against the default branch). The block recognizes ONLY
# delegate.skill + delegate.args (see the pull-request Feature's
# bars-orchestration AC). The verify gate is NOT configured here — it lives in
# gates.pull_request.pre_dispatch as a `type: deterministic` reviewer, e.g.:
#
# gates:
#   pull_request.pre_dispatch:
#     reviewers:
#       - name: verify
#         type: deterministic
#         run: ./scripts/pull-request-gate.sh
#       - name: user-approval
#         type: human
#
# pull_request:
#   delegate:
#     skill: commit-push-pr
#     args: ""

# autonomy: execution knobs for the autonomous run orchestrator (optional).
# `autonomy.autopilot` tunes specstudio:autopilot; it is a sibling of
# `autonomy.implement` (commit_cadence). All three knobs default when absent —
# a repo with NO autonomy.autopilot block resolves exactly as shown below.
# See skills/shared/autonomy-autopilot.md for the full contract. Values resolve
# across the run → session → project → user scope ladder; the verbal trigger
# ("do it autonomously") sets the run-scoped autonomy signal, which evaporates
# at run end and overrides nothing durable.
#
# autonomy:
#   autopilot:
#     publish_ceiling: pr        # stage | commit | pr   (default: pr — commits + one PR)
#     confirm_idea: true         # pause once to approve a run-created Idea (default: true)
#     stop_on:                   # halts even under autonomy; `conflict` is non-removable
#       - conflict
